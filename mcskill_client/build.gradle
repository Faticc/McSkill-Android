plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

ext {
    grpcVersion = '1.62.2'
    protobufVersion = '3.25.1'
}

dependencies {
    implementation "com.google.protobuf:protobuf-javalite:${protobufVersion}"
    implementation "io.grpc:grpc-protobuf-lite:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation("io.grpc:grpc-okhttp:${grpcVersion}") {
        // The app already bundles gson-2.8.6.jar as a plain file in libs/ (no Maven
        // coordinates), so Gradle can't dedupe it against grpc-core's transitive
        // gson dependency - excluding it here avoids a duplicate-class dexing error.
        // gson's public API used by grpc-core (JsonReader/TypeToken/etc.) is stable
        // across 2.8.6 -> 2.10.1, so the app's bundled 2.8.6 satisfies it at runtime.
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
            }
        }
    }
}

test {
    useJUnit()
}
